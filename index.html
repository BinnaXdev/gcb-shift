<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f15e2a">
<meta name="description" content="GCB Shift — work and rest rotation calendar.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>GCB Shift</title>
</head>
<body>
<div id="loader" aria-hidden="true">
  <img class="ld-logo" src="logo.png" alt="">
  <div class="ld-slogan"><span class="w1">WORK.</span><span class="w2">REST.</span><span class="w3">REPEAT.</span><span class="ld-spin">↻</span></div>
  <div class="ld-bar"><i></i></div>
</div>
<script>
(function(){var l=document.getElementById('loader');if(!l)return;
try{if(sessionStorage.getItem('gcbLoaded')){l.remove();return}sessionStorage.setItem('gcbLoaded','1')}catch(e){}
var done=false,hide=function(){if(done)return;done=true;l.classList.add('out');setTimeout(function(){if(l.parentNode)l.parentNode.removeChild(l)},500)};
setTimeout(hide,2700);l.addEventListener('click',hide)})();
</script>
<header><div class="brand"><img class="logo" src="logo.png" alt="GCB"><div><h1>GCB <span>Shift</span></h1><p data-i18n="tagline"></p></div></div></header>
<main class="container">

<section id="dashboard">
<div class="section-title" data-i18n="yourSituation"></div>
<div class="cards">
<div class="card hero"><div class="metric-label" data-i18n="statusCurrent"></div><div class="metric" id="status">—</div><div class="sub" id="statusSub"></div></div>
<div class="card"><div class="metric-label" data-i18n="daysLeft"></div><div class="metric" id="remaining">—</div><div class="sub" id="remainingSub"></div></div>
<div class="card"><div class="metric-label" data-i18n="phaseEnd"></div><div class="metric" id="phaseEnd">—</div><div class="sub" data-i18n="estDate"></div></div>
<div class="card"><div class="metric-label" data-i18n="nextStart"></div><div class="metric" id="nextStart">—</div><div class="sub" data-i18n="nextCycleStart"></div></div>
</div>
<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b id="phaseTitle"></b><span class="badge" id="progressLabel">0%</span></div><div class="progress"><span id="progressBar"></span></div><div class="sub" id="progressSub"></div></div>

<div id="backupBanner" class="card hidden" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="sub" style="margin:0" data-i18n="backupReminder"></span><button class="secondary" id="bannerBackup" data-i18n="backupNow"></button></div>

<div class="section-title" id="formTitle" data-i18n="addRotation"></div>
<div class="card">
<form id="rotationForm">
<div class="form">
<div class="field"><label for="startDate" data-i18n="startDate"></label><input id="startDate" type="date" required></div>
<div class="field"><label for="transport" data-i18n="transport"></label><select id="transport"></select></div>
<div class="field full"><label for="note" data-i18n="note"></label><input id="note" maxlength="80" data-i18n-ph="notePh"></div>
</div>
<div class="actions"><button class="primary" type="submit" id="saveBtn"></button><button class="secondary hidden" type="button" id="cancelEdit" data-i18n="cancel"></button></div>
</form>
</div>
<div class="section-title" data-i18n="myRotations"></div><div id="rotationList"></div>
</section>

<section id="calendarPage" class="hidden">
<div class="section-title" data-i18n="calTitle"></div>
<div class="card">
<div class="cal-head"><b id="calTitle"></b><div class="cal-nav"><button class="secondary" id="calPrev" aria-label="prev">‹</button><button class="secondary" id="calNext" aria-label="next">›</button></div></div>
<div class="cal-grid" id="calGrid"></div>
<div class="legend"><span><i style="background:#f4511e"></i><span data-i18n="legWork"></span></span><span><i style="background:#24b77a"></i><span data-i18n="legRest"></span></span><span><i style="background:#ffbd32"></i><span data-i18n="legHol"></span></span><span><i style="border:2px solid #ffbd32"></i><span data-i18n="legToday"></span></span></div>
<div class="day-detail" id="dayDetail"></div>
</div>
</section>

<section id="holidays" class="hidden">
<div class="section-title" data-i18n="holTitle"></div>
<div class="card"><p class="sub" style="margin-top:0" id="holIntro"></p><div id="holidayList"></div>
<div class="actions"><button class="primary" id="addHolBtn" data-i18n="holAdd"></button></div></div>
</section>

<section id="settingsPage" class="hidden">
<div class="section-title" data-i18n="appearance"></div>
<div class="card">
<div class="set-row"><label for="setLang" data-i18n="language"></label><select id="setLang"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option></select></div>
<div class="set-row"><label for="setTheme" data-i18n="theme"></label><select id="setTheme"></select></div>
<div class="set-row"><label for="setWeek" data-i18n="weekStart"></label><select id="setWeek"></select></div>
</div>

<div class="section-title" data-i18n="rulesTitle"></div>
<div class="card">
<div class="set-row"><label for="setWork" data-i18n="workDays"></label><input id="setWork" type="number" min="1" max="365" inputmode="numeric"></div>
<div class="set-row"><label for="setRest" data-i18n="baseRest"></label><input id="setRest" type="number" min="0" max="365" inputmode="numeric"></div>
<div class="set-row"><label for="setBonus" data-i18n="holBonus"></label><input id="setBonus" type="number" min="0" max="30" inputmode="numeric"></div>
<div class="set-row"><label for="setOwnFar" data-i18n="ownFarBonus"></label><input id="setOwnFar" type="number" min="0" max="30" inputmode="numeric"></div>
<div class="set-row"><label for="setOwnNear" data-i18n="ownNearBonus"></label><input id="setOwnNear" type="number" min="0" max="30" inputmode="numeric"></div>
<div class="set-row"><label for="setComp" data-i18n="compBonus"></label><input id="setComp" type="number" min="0" max="30" inputmode="numeric"></div>
<div class="hint" data-i18n="rulesNote"></div>
</div>

<div class="section-title" data-i18n="notifTitle"></div>
<div class="card">
<div class="set-row"><label for="setNotifOn" data-i18n="notifOn"></label><input id="setNotifOn" type="checkbox"></div>
<div class="set-row"><label for="setNotifTime" data-i18n="notifTime"></label><input id="setNotifTime" type="time"></div>
<div class="set-row"><label for="setNotifDays" data-i18n="notifDays"></label><select id="setNotifDays"></select></div>
<div class="hint" data-i18n="notifHint"></div><div class="hint warn" id="notifMsg"></div>
</div>

<div class="section-title" data-i18n="backupTitle"></div>
<div class="card"><p class="sub" style="margin-top:0" data-i18n="backupText"></p><div class="sub" id="lastBackup"></div>
<div class="actions"><button class="primary" id="exportBtn" data-i18n="export"></button><button class="secondary" id="importBtn" data-i18n="import"></button></div><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div>

<div class="section-title" data-i18n="resetTitle"></div>
<div class="card"><p class="sub" style="margin-top:0" data-i18n="resetText"></p><button class="secondary" id="clearBtn" data-i18n="resetBtn"></button></div>
</section>

<footer data-i18n="footer"></footer>
</main>

<div class="modal hidden" id="holModal"><div class="card">
<h3 id="holModalTitle"></h3>
<div class="form">
<div class="field full" id="holNameWrap"><label for="holName" data-i18n="holName"></label><input id="holName" maxlength="60"></div>
<div class="field full"><label for="holDate" data-i18n="holDate"></label><input id="holDate" type="date"></div>
</div>
<div class="sub" id="holModalNote"></div>
<div class="actions"><button class="primary" id="holSave" data-i18n="save"></button><button class="secondary" id="holCancel" data-i18n="cancel"></button></div>
<div class="actions"><button class="secondary hidden" id="holReset" data-i18n="resetDate"></button><button class="secondary hidden" id="holDelete" data-i18n="del"></button></div>
</div></div>

<nav>
<button class="active" data-page="dashboard">⌂<br><span data-i18n="navHome"></span></button>
<button data-page="calendarPage">▤<br><span data-i18n="navCal"></span></button>
<button data-page="holidays">▦<br><span data-i18n="navHol"></span></button>
<button data-page="settingsPage">⚙<br><span data-i18n="navSet"></span></button>
</nav>
<script src="i18n.js"></script>
<script src="holidays.js"></script>
<script src="app.js"></script>
</body></html>
